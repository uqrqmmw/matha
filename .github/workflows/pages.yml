name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # 部署前先跑完整測試：紅燈不上線（原本測試與部署平行，壞版照樣發佈）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-figure-tools.txt
      - name: Install figure-pipeline test dependencies
        run: python -m pip install -r requirements-figure-tools.txt
      - name: Test before deploy
        run: npm test && npm run test:figures && npm run test:edge
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build public site allowlist
        run: |
          mkdir -p _site
          cp index.html app.js bank.js practice-bank.js textbook-catalog.js paper-question-crops.js style.css sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp -R vendor _site/vendor
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
