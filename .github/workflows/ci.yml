name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-figure-tools.txt
      - run: python -m pip install -r requirements-figure-tools.txt
      - run: python scripts/audit_public_repo.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the full engineering suite
        run: npm test && npm run test:figures && npm run test:edge
